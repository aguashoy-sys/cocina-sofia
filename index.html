<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocina Sofía</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8f1;
  color:#333;
}

.contenedor{
  max-width:560px;
  margin:auto;
  padding:18px;
}

.encabezado{
  text-align:center;
  padding:18px 5px 10px;
}

.encabezado h1{
  margin:0;
  font-size:34px;
  color:#9b3f2f;
}

.encabezado p{
  margin:7px 0 0;
  color:#777;
}

.fecha{
  background:#9b3f2f;
  color:white;
  padding:14px;
  border-radius:14px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin:15px 0 20px;
}

.tarjeta{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.tarjeta h2{
  margin-top:0;
  color:#9b3f2f;
}

.producto{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.producto:last-child{
  border-bottom:none;
}

.nombre-producto{
  font-size:17px;
  font-weight:bold;
}

.categoria{
  font-size:12px;
  font-weight:bold;
  color:#999;
  margin-bottom:4px;
}

.precio-desayuno{
  font-weight:bold;
  color:#9b3f2f;
  margin-top:4px;
}

.disponible{
  color:#238342;
  font-size:13px;
  font-weight:bold;
  margin-top:5px;
}

.agotado{
  background:#fdeaea;
  color:#a42121;
  padding:9px 11px;
  border-radius:9px;
  font-size:13px;
  font-weight:bold;
  margin-top:8px;
}

.producto-agotado{
  opacity:.75;
}

.precio-menu{
  text-align:center;
  font-size:25px;
  font-weight:bold;
  color:#9b3f2f;
  margin:18px 0 5px;
}

.aviso-agotado{
  background:#fdeaea;
  color:#9c2222;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  margin-top:15px;
  line-height:1.5;
}

.aviso{
  background:#fff3cd;
  color:#6b5500;
  padding:14px;
  border-radius:12px;
  line-height:1.4;
}

.tipo-pedido{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}

.tipo-pedido button{
  padding:15px 8px;
  border:2px solid #9b3f2f;
  background:white;
  color:#9b3f2f;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.tipo-pedido button.activo{
  background:#9b3f2f;
  color:white;
}

.tipo-pedido button:disabled{
  border-color:#bbb;
  color:#999;
  background:#eee;
  cursor:not-allowed;
}

.campo{
  margin-bottom:16px;
}

.campo label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.campo input,
.campo select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  background:white;
  font-size:16px;
}

.check-menu{
  display:flex;
  gap:10px;
  align-items:flex-start;
  background:#fff8f1;
  border-radius:12px;
  padding:14px;
}

.check-menu input{
  width:22px;
  height:22px;
  margin-top:2px;
}

.check-menu label{
  line-height:1.4;
}

.boton-whatsapp{
  width:100%;
  border:none;
  background:#25D366;
  color:white;
  padding:18px;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
}

.error{
  background:#fdeaea;
  color:#9c2222;
  padding:14px;
  border-radius:12px;
  margin-top:15px;
  display:none;
}

.oculto{
  display:none;
}

.pie{
  text-align:center;
  color:#999;
  font-size:13px;
  padding:10px 10px 25px;
}
</style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>🍴 Cocina Sofía</h1>
    <p>Comida casera, cerca de ti</p>
  </div>

  <div class="fecha" id="fechaBonita">
    Cargando fecha...
  </div>


  <!-- DESAYUNOS -->

  <div class="tarjeta">

    <h2>🌅 Desayunos</h2>

    <div id="desayunos">
      Cargando desayunos...
    </div>

  </div>


  <!-- COMIDA -->

  <div class="tarjeta">

    <h2>🍲 Menú de hoy</h2>

    <div id="menuComida">
      Cargando menú...
    </div>

    <div
      class="precio-menu"
      id="precioComida">
    </div>

    <div id="avisoComidaAgotada"></div>

  </div>


  <!-- PEDIDO -->

  <div class="tarjeta">

    <h2>📲 Haz tu pedido</h2>


    <div class="tipo-pedido">

      <button
        id="btnDesayuno"
        type="button"
        onclick="seleccionarTipo('DESAYUNO')">

        🌅 Desayuno

      </button>


      <button
        id="btnComida"
        type="button"
        onclick="seleccionarTipo('COMIDA')">

        🍲 Comida

      </button>

    </div>


    <div
      id="seleccionDesayuno"
      class="campo oculto">

      <label>
        ¿Qué desayuno quieres?
      </label>

      <select id="desayunoPedido">

        <option value="">
          Selecciona...
        </option>

      </select>

    </div>


    <div class="campo">

      <label>
        👤 Nombre
      </label>

      <input
        id="nombre"
        type="text"
        placeholder="Tu nombre">

    </div>


    <div class="campo">

      <label>
        🏢 Área
      </label>

      <input
        id="area"
        type="text"
        placeholder="Ejemplo: Recursos Humanos">

    </div>


    <div class="campo">

      <label>
        🛗 Piso
      </label>

      <input
        id="piso"
        type="text"
        placeholder="Ejemplo: Piso 3">

    </div>


    <div class="campo">

      <label>
        🍽️ Cantidad
      </label>

      <input
        id="cantidad"
        type="number"
        inputmode="numeric"
        value="1"
        min="1"
        max="20">

    </div>


    <div class="campo">

      <label>
        🕐 Horario de entrega
      </label>

      <select id="horario">

        <option value="">
          Primero selecciona desayuno o comida
        </option>

      </select>

    </div>


    <div class="check-menu">

      <input
        type="checkbox"
        id="recibirMenu">


      <label for="recibirMenu">

        <strong>
          🔔 Quiero recibir el menú diario por WhatsApp
        </strong>

        <br>

        <small>
          Agrégame a la lista de difusión de Cocina Sofía.
        </small>

      </label>

    </div>


    <button
      class="boton-whatsapp"
      type="button"
      onclick="enviarPedido()">

      🟢 PEDIR POR WHATSAPP

    </button>


    <div
      class="error"
      id="errorPedido">
    </div>

  </div>


  <div class="pie">

    Cocina Sofía · Gracias por tu preferencia ❤️

  </div>

</div>


<script>

// ========================================
// CONFIGURACIÓN
// ========================================

const SUPABASE_URL =
"https://yawuozkdndxdreepqlaw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SNZVLb4pwoSdNO2iBKn2lA_qjegXePB";

const WHATSAPP =
"524491041613";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let menuHoy = [];

let desayunosHoy = [];

let desayunosDisponibles = [];

let productosComida = [];

let precioComida = 0;

let comidaDisponible = false;

let tipoSeleccionado = "";



// ========================================
// FECHA
// ========================================

function fechaLocalISO(){

  const ahora =
    new Date();

  const year =
    ahora.getFullYear();

  const month =
    String(
      ahora.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      ahora.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;

}


function obtenerFechaBonita(){

  let texto =
    new Date()
    .toLocaleDateString(
      "es-MX",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );

  return (
    texto.charAt(0).toUpperCase()
    +
    texto.slice(1)
  );

}


document
  .getElementById(
    "fechaBonita"
  )
  .textContent =
    "📅 " +
    obtenerFechaBonita();



// ========================================
// CARGAR MENÚ COMPLETO
// ========================================

async function cargarMenu(){

  const {
    data,
    error
  } =
    await db.rpc(
      "cs_menu_completo_dia",
      {
        p_fecha:
          fechaLocalISO()
      }
    );


  if(error){

    console.error(error);

    document
      .getElementById(
        "desayunos"
      )
      .innerHTML =
        '<div class="aviso">No fue posible cargar los desayunos.</div>';


    document
      .getElementById(
        "menuComida"
      )
      .innerHTML =
        '<div class="aviso">No fue posible cargar el menú.</div>';

    return;

  }


  menuHoy =
    data || [];


  desayunosHoy =
    menuHoy.filter(
      x =>
        x.tipo ===
        "DESAYUNO"
    );


  desayunosDisponibles =
    desayunosHoy.filter(
      x =>
        x.disponible === true
    );


  productosComida =
    menuHoy.filter(
      x =>
        x.tipo ===
        "COMIDA"
    );


  if(
    productosComida.length > 0
  ){

    precioComida =
      Number(
        productosComida[0]
          .precio_menu
      );


    /*
      La comida completa se maneja
      como una sola unidad.
    */

    comidaDisponible =
      productosComida.every(
        x =>
          x.disponible === true
      );

  }

  else{

    precioComida = 0;

    comidaDisponible = false;

  }


  mostrarDesayunos();

  mostrarComida();

  actualizarBotonesPedido();

}



// ========================================
// MOSTRAR DESAYUNOS
// ========================================

function mostrarDesayunos(){

  const contenedor =
    document.getElementById(
      "desayunos"
    );


  const selector =
    document.getElementById(
      "desayunoPedido"
    );


  selector.innerHTML =
    '<option value="">Selecciona...</option>';


  if(
    desayunosHoy.length === 0
  ){

    contenedor.innerHTML = `

      <div class="aviso">

        Los desayunos de hoy aún no han sido publicados.

      </div>

    `;

    return;

  }


  contenedor.innerHTML =
    "";


  desayunosHoy.forEach(
    item => {

      const fila =
        document.createElement(
          "div"
        );


      fila.className =
        item.disponible
          ? "producto"
          : "producto producto-agotado";


      const precio =
        Number(
          item.precio_menu
        );


      fila.innerHTML = `

        <div class="nombre-producto">

          ${item.nombre}

        </div>


        <div class="precio-desayuno">

          $${precio.toFixed(0)}

        </div>


        ${
          item.disponible

          ? `

            <div class="disponible">

              🟢 Disponible

            </div>

          `

          : `

            <div class="agotado">

              🔴 Agotado por hoy.
              ¡Gracias por tu preferencia!

            </div>

          `
        }

      `;


      contenedor.appendChild(
        fila
      );



      /*
        Solamente los disponibles
        aparecen en el selector
        para realizar pedidos.
      */

      if(
        item.disponible
      ){

        const option =
          document.createElement(
            "option"
          );


        option.value =
          String(
            item.producto_id
          );


        option.textContent =
          item.nombre
          +
          " - $"
          +
          precio.toFixed(0);


        selector.appendChild(
          option
        );

      }

    }
  );

}



// ========================================
// MOSTRAR COMIDA
// ========================================

function mostrarComida(){

  const contenedor =
    document.getElementById(
      "menuComida"
    );


  const precio =
    document.getElementById(
      "precioComida"
    );


  const aviso =
    document.getElementById(
      "avisoComidaAgotada"
    );


  aviso.innerHTML =
    "";


  if(
    productosComida.length === 0
  ){

    contenedor.innerHTML = `

      <div class="aviso">

        El menú de hoy aún no ha sido publicado.

      </div>

    `;


    precio.textContent =
      "";


    return;

  }


  contenedor.innerHTML =
    "";


  productosComida.forEach(
    item => {

      const fila =
        document.createElement(
          "div"
        );


      fila.className =
        comidaDisponible
          ? "producto"
          : "producto producto-agotado";


      fila.innerHTML = `

        <div class="categoria">

          ${nombreCategoria(
            item.categoria
          )}

        </div>


        <div class="nombre-producto">

          ${item.nombre}

        </div>

      `;


      contenedor.appendChild(
        fila
      );

    }
  );


  precio.textContent =
    "MENÚ COMPLETO $"
    +
    precioComida.toFixed(0);


  if(
    !comidaDisponible
  ){

    aviso.innerHTML = `

      <div class="aviso-agotado">

        🔴 Menú agotado por hoy.

        <br>

        ¡Gracias por tu preferencia! ❤️

      </div>

    `;

  }

}



// ========================================
// CATEGORÍAS
// ========================================

function nombreCategoria(
  categoria
){

  const nombres = {

    SOPA_CREMA:
      "🥣 SOPA / CREMA",

    GUISO:
      "🍗 GUISO",

    GUARNICION:
      "🍚 GUARNICIÓN",

    POSTRE:
      "🍮 POSTRE",

    AGUA:
      "🥤 AGUA"

  };


  return (
    nombres[categoria]
    ||
    categoria
  );

}



// ========================================
// BOTONES DISPONIBLES
// ========================================

function actualizarBotonesPedido(){

  const btnDesayuno =
    document.getElementById(
      "btnDesayuno"
    );


  const btnComida =
    document.getElementById(
      "btnComida"
    );


  btnDesayuno.disabled =
    desayunosDisponibles.length === 0;


  btnComida.disabled =
    !comidaDisponible;



  /*
    Si algo se agotó mientras el cliente
    tenía abierta la página, eliminamos
    esa selección.
  */

  if(
    tipoSeleccionado ===
    "DESAYUNO"
    &&
    desayunosDisponibles.length === 0
  ){

    tipoSeleccionado =
      "";

    btnDesayuno
      .classList
      .remove(
        "activo"
      );

  }


  if(
    tipoSeleccionado ===
    "COMIDA"
    &&
    !comidaDisponible
  ){

    tipoSeleccionado =
      "";

    btnComida
      .classList
      .remove(
        "activo"
      );

  }

}



// ========================================
// SELECCIONAR TIPO
// ========================================

function seleccionarTipo(
  tipo
){

  ocultarError();


  if(
    tipo === "DESAYUNO"
    &&
    desayunosDisponibles.length === 0
  ){

    mostrarError(
      "Los desayunos están agotados por hoy."
    );

    return;

  }


  if(
    tipo === "COMIDA"
    &&
    !comidaDisponible
  ){

    mostrarError(
      "El menú de comida está agotado por hoy."
    );

    return;

  }


  tipoSeleccionado =
    tipo;


  document
    .getElementById(
      "btnDesayuno"
    )
    .classList
    .remove(
      "activo"
    );


  document
    .getElementById(
      "btnComida"
    )
    .classList
    .remove(
      "activo"
    );


  if(
    tipo ===
    "DESAYUNO"
  ){

    document
      .getElementById(
        "btnDesayuno"
      )
      .classList
      .add(
        "activo"
      );


    document
      .getElementById(
        "seleccionDesayuno"
      )
      .classList
      .remove(
        "oculto"
      );


    cargarHorarios([
      "10:00 AM",
      "11:00 AM",
      "12:00 PM"
    ]);

  }


  if(
    tipo ===
    "COMIDA"
  ){

    document
      .getElementById(
        "btnComida"
      )
      .classList
      .add(
        "activo"
      );


    document
      .getElementById(
        "seleccionDesayuno"
      )
      .classList
      .add(
        "oculto"
      );


    cargarHorarios([
      "12:00 PM",
      "1:00 PM",
      "2:00 PM"
    ]);

  }

}



// ========================================
// HORARIOS
// ========================================

function cargarHorarios(
  horarios
){

  const select =
    document.getElementById(
      "horario"
    );


  select.innerHTML =
    '<option value="">Selecciona horario...</option>';


  horarios.forEach(
    hora => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        hora;


      option.textContent =
        hora;


      select.appendChild(
        option
      );

    }
  );

}



// ========================================
// ENVIAR PEDIDO
// ========================================

async function enviarPedido(){

  ocultarError();


  /*
    Antes de generar el WhatsApp,
    consultamos nuevamente Supabase.

    Esto reduce el riesgo de pedir algo
    que se agotó mientras el cliente
    llenaba el formulario.
  */

  const {
    data:menuActualizado,
    error:errorActualizacion
  } =
    await db.rpc(
      "cs_menu_completo_dia",
      {
        p_fecha:
          fechaLocalISO()
      }
    );


  if(errorActualizacion){

    console.error(
      errorActualizacion
    );


    mostrarError(
      "No pudimos verificar la disponibilidad. Intenta nuevamente."
    );

    return;

  }


  menuHoy =
    menuActualizado || [];


  desayunosHoy =
    menuHoy.filter(
      x =>
        x.tipo ===
        "DESAYUNO"
    );


  desayunosDisponibles =
    desayunosHoy.filter(
      x =>
        x.disponible === true
    );


  productosComida =
    menuHoy.filter(
      x =>
        x.tipo ===
        "COMIDA"
    );


  comidaDisponible =
    productosComida.length > 0
    &&
    productosComida.every(
      x =>
        x.disponible === true
    );


  if(
    productosComida.length > 0
  ){

    precioComida =
      Number(
        productosComida[0]
          .precio_menu
      );

  }


  /*
    Refrescamos visualmente por si
    algo acaba de agotarse.
  */

  mostrarDesayunos();

  mostrarComida();

  actualizarBotonesPedido();



  const nombre =
    document
      .getElementById(
        "nombre"
      )
      .value
      .trim();


  const area =
    document
      .getElementById(
        "area"
      )
      .value
      .trim();


  const piso =
    document
      .getElementById(
        "piso"
      )
      .value
      .trim();


  const cantidad =
    Number(
      document
        .getElementById(
          "cantidad"
        )
        .value
    );


  const horario =
    document
      .getElementById(
        "horario"
      )
      .value;


  const recibirMenu =
    document
      .getElementById(
        "recibirMenu"
      )
      .checked;



  if(
    !tipoSeleccionado
  ){

    mostrarError(
      "Selecciona si quieres desayuno o comida."
    );

    return;

  }


  if(!nombre){

    mostrarError(
      "Escribe tu nombre."
    );

    return;

  }


  if(!area){

    mostrarError(
      "Escribe tu área."
    );

    return;

  }


  if(!piso){

    mostrarError(
      "Escribe tu piso."
    );

    return;

  }


  if(
    !cantidad
    ||
    cantidad < 1
  ){

    mostrarError(
      "Selecciona una cantidad válida."
    );

    return;

  }


  if(!horario){

    mostrarError(
      "Selecciona el horario de entrega."
    );

    return;

  }



  let detalle =
    "";

  let total =
    0;



  // ========================================
  // PEDIDO DESAYUNO
  // ========================================

  if(
    tipoSeleccionado ===
    "DESAYUNO"
  ){

    const productoId =
      Number(
        document
          .getElementById(
            "desayunoPedido"
          )
          .value
      );


    if(!productoId){

      mostrarError(
        "Selecciona qué desayuno quieres."
      );

      return;

    }


    const item =
      desayunosDisponibles.find(
        x =>
          Number(
            x.producto_id
          )
          ===
          productoId
      );


    if(!item){

      mostrarError(
        "Ese desayuno acaba de agotarse. Elige otro disponible."
      );

      return;

    }


    const precio =
      Number(
        item.precio_menu
      );


    detalle =
      item.nombre;


    total =
      precio
      *
      cantidad;

  }



  // ========================================
  // PEDIDO COMIDA
  // ========================================

  if(
    tipoSeleccionado ===
    "COMIDA"
  ){

    if(
      !comidaDisponible
    ){

      mostrarError(
        "El menú de comida acaba de agotarse por hoy."
      );

      return;

    }


    detalle =
      productosComida
      .map(
        x =>
          "• " +
          x.nombre
      )
      .join(
        "\n"
      );


    total =
      precioComida
      *
      cantidad;

  }



  // ========================================
  // SUSCRIPCIÓN
  // ========================================

  const textoSuscripcion =
    recibirMenu

      ? "SÍ - Por favor agrégame a la lista de difusión."

      : "NO";



  const tipoTexto =
    tipoSeleccionado ===
    "DESAYUNO"

      ? "🌅 DESAYUNO"

      : "🍲 COMIDA";



  // ========================================
  // MENSAJE WHATSAPP
  // ========================================

  const mensaje =

`🍴 *PEDIDO COCINA SOFÍA*

📅 ${obtenerFechaBonita()}

${tipoTexto}

${detalle}

🍽️ Cantidad: ${cantidad}
💰 Total: $${total.toFixed(0)}

👤 Nombre: ${nombre}
🏢 Área: ${area}
🛗 Piso: ${piso}
🕐 Entrega: ${horario}

🔔 *Quiero recibir el menú diario:*
${textoSuscripcion}`;



  const url =
    "https://wa.me/"
    +
    WHATSAPP
    +
    "?text="
    +
    encodeURIComponent(
      mensaje
    );


  window.open(
    url,
    "_blank"
  );

}



// ========================================
// ERRORES
// ========================================

function mostrarError(
  texto
){

  const error =
    document.getElementById(
      "errorPedido"
    );


  error.textContent =
    texto;


  error.style.display =
    "block";

}


function ocultarError(){

  document
    .getElementById(
      "errorPedido"
    )
    .style.display =
      "none";

}



// ========================================
// INICIAR
// ========================================

cargarMenu();

</script>

</body>
</html>
