<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocina Sofía | Administrar menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8f1;
  color:#333;
}

.contenedor{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.encabezado{
  text-align:center;
  margin-bottom:22px;
}

.encabezado h1{
  margin-bottom:5px;
  color:#9b3f2f;
}

.fecha{
  background:#9b3f2f;
  color:white;
  padding:14px;
  border-radius:14px;
  font-weight:bold;
  text-align:center;
  font-size:18px;
}

.tarjeta{
  background:white;
  margin-top:18px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.tarjeta h2{
  margin-top:0;
  color:#9b3f2f;
}

.campo{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}

.desayuno{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.desayuno-superior{
  display:grid;
  grid-template-columns:28px 1fr 95px;
  gap:10px;
  align-items:center;
}

.desayuno-superior input[type="checkbox"]{
  width:22px;
  height:22px;
}

.desayuno-superior label{
  margin:0;
  font-weight:normal;
  font-size:17px;
}

.precio-desayuno{
  padding:10px;
  text-align:center;
}

.etiqueta-precio{
  font-size:12px;
  color:#777;
  text-align:center;
  margin-bottom:3px;
}

.estado-desayuno{
  margin-top:10px;
  margin-left:38px;
}

.boton-estado{
  border:none;
  border-radius:9px;
  padding:10px 13px;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.disponible{
  background:#e4f6e9;
  color:#176b32;
}

.agotado{
  background:#fdeaea;
  color:#9c2222;
}

.boton{
  width:100%;
  border:none;
  padding:18px;
  margin-top:20px;
  border-radius:14px;
  background:#9b3f2f;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.boton:disabled,
.boton-estado:disabled{
  opacity:.5;
}

.boton-agotado{
  width:100%;
  border:2px solid #b52b2b;
  background:white;
  color:#b52b2b;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.boton-reactivar{
  width:100%;
  border:2px solid #238342;
  background:white;
  color:#238342;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.mensaje{
  display:none;
  margin-top:18px;
  padding:16px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.exito{
  display:block;
  background:#e6f7eb;
  color:#176b32;
}

.error{
  display:block;
  background:#fdeaea;
  color:#9c2222;
}

.info{
  background:#f7f1ea;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
  margin-bottom:15px;
}

.separador{
  border:none;
  border-top:1px solid #eee;
  margin:22px 0;
}

.estado-comida{
  text-align:center;
  font-weight:bold;
  margin:15px 0 5px;
}

.verde{color:#238342}
.rojo{color:#b52b2b}

.cargando{
  color:#777;
}
</style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>🍴 Cocina Sofía</h1>
    <div>Panel para publicar el menú</div>
  </div>

  <div class="fecha" id="fechaBonita">
    Cargando fecha...
  </div>


  <!-- DESAYUNOS -->

  <div class="tarjeta">

    <h2>🌅 Desayunos de hoy</h2>

    <div class="info">
      Marca los desayunos que ofrecerás hoy y escribe su precio.
      Si alguno se termina durante el día, podrás marcarlo como
      <strong>agotado</strong> sin borrarlo.
    </div>

    <div id="listaDesayunos" class="cargando">
      Cargando...
    </div>

  </div>


  <!-- COMIDA -->

  <div class="tarjeta">

    <h2>🍲 Comida de hoy</h2>

    <div class="campo">
      <label>🥣 Sopa o crema</label>
      <select id="sopa"></select>
    </div>

    <div class="campo">
      <label>🍗 Guiso</label>
      <select id="guiso"></select>
    </div>

    <div class="campo">
      <label>🍚 Guarnición 1</label>
      <select id="guarnicion1"></select>
    </div>

    <div class="campo">
      <label>🍚 Guarnición 2</label>
      <select id="guarnicion2"></select>
    </div>

    <div class="campo">
      <label>🍮 Postre</label>
      <select id="postre"></select>
    </div>

    <div class="campo">
      <label>🥤 Agua</label>
      <select id="agua"></select>
    </div>

    <hr class="separador">

    <div class="campo">
      <label>💰 Precio del menú completo</label>

      <input
        id="precio"
        type="number"
        inputmode="decimal"
        placeholder="Ejemplo: 95"
        min="0">
    </div>


    <button
      class="boton"
      id="publicar"
      onclick="publicarTodo()">
      PUBLICAR / ACTUALIZAR MENÚ DE HOY
    </button>


    <div id="controlComida" style="display:none">

      <hr class="separador">

      <div
        id="estadoComida"
        class="estado-comida">
      </div>

      <button
        id="botonEstadoComida"
        onclick="cambiarEstadoComida()">
      </button>

    </div>


    <div
      id="mensaje"
      class="mensaje">
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://yawuozkdndxdreepqlaw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SNZVLb4pwoSdNO2iBKn2lA_qjegXePB";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let productos = [];

let menuHoy = [];

let comidaDisponible = true;


// ========================================
// FECHA
// ========================================

function fechaLocalISO(){

  const ahora = new Date();

  const year =
    ahora.getFullYear();

  const month =
    String(ahora.getMonth()+1)
    .padStart(2,"0");

  const day =
    String(ahora.getDate())
    .padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function mostrarFecha(){

  const fecha = new Date();

  const texto =
    fecha.toLocaleDateString(
      "es-MX",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );

  document
    .getElementById("fechaBonita")
    .textContent =
      "📅 " +
      texto.charAt(0).toUpperCase() +
      texto.slice(1);
}



// ========================================
// INICIAR
// ========================================

async function iniciar(){

  mostrarFecha();

  await cargarProductos();

  await cargarMenuHoy();

}



// ========================================
// PRODUCTOS
// ========================================

async function cargarProductos(){

  const {data,error} =
    await db
      .from("cs_productos")
      .select("id,categoria,nombre,precio")
      .eq("activo",true)
      .order("orden");


  if(error){

    console.error(error);

    mostrarMensaje(
      "No fue posible cargar los productos.",
      false
    );

    return;
  }


  productos = data;


  cargarSelect(
    "sopa",
    productos.filter(
      x => x.categoria === "SOPA_CREMA"
    )
  );

  cargarSelect(
    "guiso",
    productos.filter(
      x => x.categoria === "GUISO"
    )
  );

  cargarSelect(
    "guarnicion1",
    productos.filter(
      x => x.categoria === "GUARNICION"
    )
  );

  cargarSelect(
    "guarnicion2",
    productos.filter(
      x => x.categoria === "GUARNICION"
    )
  );

  cargarSelect(
    "postre",
    productos.filter(
      x => x.categoria === "POSTRE"
    )
  );

  cargarSelect(
    "agua",
    productos.filter(
      x => x.categoria === "AGUA"
    )
  );


  cargarDesayunos(
    productos.filter(
      x => x.categoria === "DESAYUNO"
    )
  );

}



// ========================================
// SELECTS
// ========================================

function cargarSelect(id,lista){

  const select =
    document.getElementById(id);

  select.innerHTML =
    '<option value="">Seleccionar...</option>';


  lista.forEach(p => {

    const opcion =
      document.createElement("option");

    opcion.value = p.id;

    opcion.textContent = p.nombre;

    select.appendChild(opcion);

  });

}



// ========================================
// CREAR DESAYUNOS
// ========================================

function cargarDesayunos(lista){

  const contenedor =
    document.getElementById(
      "listaDesayunos"
    );

  contenedor.innerHTML = "";


  lista.forEach(p => {

    const fila =
      document.createElement("div");

    fila.className = "desayuno";

    fila.id =
      "fila_desayuno_" + p.id;


    fila.innerHTML = `

      <div class="desayuno-superior">

        <input
          type="checkbox"
          class="checkDesayuno"
          value="${p.id}"
          id="desayuno_${p.id}"
        >

        <label for="desayuno_${p.id}">
          ${p.nombre}
        </label>

        <div>

          <div class="etiqueta-precio">
            Precio
          </div>

          <input
            type="number"
            inputmode="decimal"
            min="0"
            placeholder="$"
            class="precio-desayuno"
            id="precio_${p.id}"
          >

        </div>

      </div>


      <div
        class="estado-desayuno"
        id="estado_${p.id}">
      </div>

    `;


    contenedor.appendChild(fila);

  });

}



// ========================================
// RECUPERAR MENÚ YA PUBLICADO
// ========================================

async function cargarMenuHoy(){

  /*
    IMPORTANTE:
    No filtramos disponible=true porque necesitamos
    recuperar también los productos agotados.
  */

  const {data,error} =
    await db
      .from("cs_menu_dia")
      .select(`
        id,
        fecha,
        tipo,
        producto_id,
        disponible,
        precio_menu,
        cs_productos(
          id,
          categoria,
          nombre
        )
      `)
      .eq(
        "fecha",
        fechaLocalISO()
      );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No fue posible recuperar el menú de hoy.",
      false
    );

    return;
  }


  menuHoy = data || [];


  recuperarDesayunos();

  recuperarComida();

}



// ========================================
// RECUPERAR DESAYUNOS
// ========================================

function recuperarDesayunos(){

  const desayunos =
    menuHoy.filter(
      x => x.tipo === "DESAYUNO"
    );


  desayunos.forEach(item => {

    const check =
      document.getElementById(
        "desayuno_" +
        item.producto_id
      );

    const precio =
      document.getElementById(
        "precio_" +
        item.producto_id
      );


    if(check){
      check.checked = true;
    }


    if(precio){
      precio.value =
        Number(item.precio_menu);
    }


    mostrarEstadoDesayuno(
      item
    );

  });

}



// ========================================
// ESTADO DESAYUNO
// ========================================

function mostrarEstadoDesayuno(item){

  const contenedor =
    document.getElementById(
      "estado_" +
      item.producto_id
    );


  if(!contenedor){
    return;
  }


  const texto =
    item.disponible
      ? "🟢 Disponible"
      : "🔴 Agotado por hoy";


  const clase =
    item.disponible
      ? "boton-estado disponible"
      : "boton-estado agotado";


  const accion =
    item.disponible
      ? "MARCAR AGOTADO"
      : "VOLVER A ACTIVAR";


  contenedor.innerHTML = `

    <strong>
      ${texto}
    </strong>

    &nbsp;

    <button
      class="${clase}"
      onclick="cambiarEstadoDesayuno(
        ${item.id},
        ${item.producto_id},
        ${item.disponible}
      )">
      ${accion}
    </button>

  `;

}



// ========================================
// CAMBIAR ESTADO DESAYUNO
// ========================================

async function cambiarEstadoDesayuno(
  menuId,
  productoId,
  estadoActual
){

  const nuevoEstado =
    !estadoActual;


  const {error} =
    await db.rpc(
      "cs_cambiar_disponibilidad_desayuno",
      {
        p_menu_id:
          menuId,

        p_disponible:
          nuevoEstado
      }
    );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cambiar el estado del desayuno.",
      false
    );

    return;
  }


  mostrarMensaje(
    nuevoEstado
      ? "✅ Desayuno disponible nuevamente."
      : "🔴 Desayuno marcado como agotado.",
    true
  );


  await cargarMenuHoy();

}



// ========================================
// RECUPERAR COMIDA
// ========================================

function recuperarComida(){

  const comida =
    menuHoy.filter(
      x => x.tipo === "COMIDA"
    );


  if(comida.length === 0){

    document
      .getElementById(
        "controlComida"
      )
      .style.display =
        "none";

    return;
  }


  const porCategoria = {};


  comida.forEach(item => {

    if(
      item.cs_productos
      &&
      !porCategoria[
        item.cs_productos.categoria
      ]
    ){

      porCategoria[
        item.cs_productos.categoria
      ] = item;

    }

  });


  asignarSelect(
    "sopa",
    porCategoria.SOPA_CREMA
  );


  asignarSelect(
    "guiso",
    porCategoria.GUISO
  );


  const guarniciones =
    comida.filter(
      x =>
        x.cs_productos
        &&
        x.cs_productos.categoria
          === "GUARNICION"
    );


  if(guarniciones[0]){

    document
      .getElementById(
        "guarnicion1"
      )
      .value =
        guarniciones[0]
          .producto_id;

  }


  if(guarniciones[1]){

    document
      .getElementById(
        "guarnicion2"
      )
      .value =
        guarniciones[1]
          .producto_id;

  }


  asignarSelect(
    "postre",
    porCategoria.POSTRE
  );


  asignarSelect(
    "agua",
    porCategoria.AGUA
  );


  document
    .getElementById("precio")
    .value =
      Number(
        comida[0].precio_menu
      );


  /*
    Toda la comida se publica con el mismo estado,
    así que tomamos el primero.
  */

  comidaDisponible =
    comida[0].disponible;


  mostrarEstadoComida();

}



// ========================================
// ASIGNAR SELECT
// ========================================

function asignarSelect(
  id,
  item
){

  if(!item){
    return;
  }


  document
    .getElementById(id)
    .value =
      item.producto_id;

}



// ========================================
// ESTADO COMIDA
// ========================================

function mostrarEstadoComida(){

  const control =
    document.getElementById(
      "controlComida"
    );

  const estado =
    document.getElementById(
      "estadoComida"
    );

  const boton =
    document.getElementById(
      "botonEstadoComida"
    );


  control.style.display =
    "block";


  if(comidaDisponible){

    estado.innerHTML =
      '<span class="verde">🟢 COMIDA DISPONIBLE</span>';

    boton.textContent =
      "🔴 MARCAR COMIDA AGOTADA";

    boton.className =
      "boton-agotado";

  }

  else{

    estado.innerHTML =
      '<span class="rojo">🔴 COMIDA AGOTADA POR HOY</span>';

    boton.textContent =
      "🟢 VOLVER A ACTIVAR COMIDA";

    boton.className =
      "boton-reactivar";

  }

}



// ========================================
// CAMBIAR ESTADO COMIDA
// ========================================

async function cambiarEstadoComida(){

  const nuevoEstado =
    !comidaDisponible;


  const {error} =
    await db.rpc(
      "cs_cambiar_disponibilidad_comida",
      {

        p_fecha:
          fechaLocalISO(),

        p_disponible:
          nuevoEstado

      }
    );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cambiar el estado de la comida.",
      false
    );

    return;
  }


  comidaDisponible =
    nuevoEstado;


  mostrarEstadoComida();


  mostrarMensaje(
    nuevoEstado
      ? "✅ La comida está disponible nuevamente."
      : "🔴 La comida fue marcada como agotada.",
    true
  );

}



// ========================================
// PUBLICAR / ACTUALIZAR
// ========================================

async function publicarTodo(){

  const boton =
    document.getElementById(
      "publicar"
    );


  const sopa =
    document.getElementById(
      "sopa"
    ).value;

  const guiso =
    document.getElementById(
      "guiso"
    ).value;

  const g1 =
    document.getElementById(
      "guarnicion1"
    ).value;

  const g2 =
    document.getElementById(
      "guarnicion2"
    ).value;

  const postre =
    document.getElementById(
      "postre"
    ).value;

  const agua =
    document.getElementById(
      "agua"
    ).value;

  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    );


  if(
    !sopa ||
    !guiso ||
    !g1 ||
    !g2 ||
    !postre ||
    !agua
  ){

    mostrarMensaje(
      "Selecciona todos los elementos de la comida.",
      false
    );

    return;
  }


  if(g1 === g2){

    mostrarMensaje(
      "Selecciona dos guarniciones diferentes.",
      false
    );

    return;
  }


  if(
    !precio ||
    precio <= 0
  ){

    mostrarMensaje(
      "Escribe el precio del menú.",
      false
    );

    return;
  }



  // DESAYUNOS SELECCIONADOS

  const checks =
    Array.from(
      document.querySelectorAll(
        ".checkDesayuno:checked"
      )
    );


  const desayunos = [];

  const preciosDesayuno = [];


  for(
    const check
    of checks
  ){

    const id =
      Number(check.value);


    const precioDesayuno =
      Number(
        document
          .getElementById(
            "precio_" + id
          )
          .value
      );


    if(
      !precioDesayuno ||
      precioDesayuno <= 0
    ){

      mostrarMensaje(
        "Escribe el precio de todos los desayunos seleccionados.",
        false
      );

      return;
    }


    desayunos.push(id);

    preciosDesayuno.push(
      precioDesayuno
    );

  }


  const productosComida = [

    Number(sopa),
    Number(guiso),
    Number(g1),
    Number(g2),
    Number(postre),
    Number(agua)

  ];


  boton.disabled = true;

  boton.textContent =
    "PUBLICANDO...";



  // PUBLICAR COMIDA

  const {
    error:errorComida
  } =
    await db.rpc(
      "cs_publicar_menu",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          productosComida,

        p_precio:
          precio

      }
    );


  if(errorComida){

    console.error(
      errorComida
    );

    mostrarMensaje(
      "No se pudo publicar la comida.",
      false
    );

    restaurarBoton();

    return;
  }



  // PUBLICAR DESAYUNOS

  const {
    error:errorDesayuno
  } =
    await db.rpc(
      "cs_publicar_desayunos_con_precio",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          desayunos,

        p_precios:
          preciosDesayuno

      }
    );


  if(errorDesayuno){

    console.error(
      errorDesayuno
    );

    mostrarMensaje(
      "La comida se publicó, pero hubo un problema con los desayunos.",
      false
    );

    restaurarBoton();

    return;
  }


  mostrarMensaje(
    "✅ Menú de hoy publicado / actualizado correctamente.",
    true
  );


  restaurarBoton();


  await cargarMenuHoy();

}



// ========================================
// MENSAJES
// ========================================

function mostrarMensaje(
  texto,
  correcto
){

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.textContent =
    texto;


  mensaje.className =
    correcto
      ? "mensaje exito"
      : "mensaje error";

}


function restaurarBoton(){

  const boton =
    document.getElementById(
      "publicar"
    );


  boton.disabled =
    false;


  boton.textContent =
    "PUBLICAR / ACTUALIZAR MENÚ DE HOY";

}



// ========================================
// ARRANCAR
// ========================================

iniciar();

</script>

</body>
</html>
