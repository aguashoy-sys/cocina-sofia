<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocina Sofía | Administrar menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8f1;
  color:#333;
}

.contenedor{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.encabezado{
  text-align:center;
  margin-bottom:20px;
}

.encabezado h1{
  margin:0 0 5px;
  color:#9b3f2f;
}

.encabezado div{
  color:#777;
}

.fecha{
  background:#9b3f2f;
  color:white;
  padding:14px;
  border-radius:14px;
  font-weight:bold;
  text-align:center;
  font-size:18px;
}


/* TARJETAS */

.tarjeta{
  background:white;
  margin-top:18px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.tarjeta h2{
  margin-top:0;
  color:#9b3f2f;
}

.info{
  background:#fff8f1;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
  margin-bottom:15px;
}


/* CAMPOS */

.campo{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}


/* DESAYUNOS */

.desayuno{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.desayuno:last-child{
  border-bottom:none;
}

.desayuno-superior{
  display:grid;
  grid-template-columns:28px 1fr 95px;
  gap:10px;
  align-items:center;
}

.desayuno-superior input[type="checkbox"]{
  width:22px;
  height:22px;
}

.desayuno-superior label{
  margin:0;
  font-weight:normal;
  font-size:17px;
}

.etiqueta-precio{
  font-size:12px;
  color:#777;
  text-align:center;
  margin-bottom:3px;
}

.precio-desayuno{
  padding:10px;
  text-align:center;
}

.estado-desayuno{
  margin-top:10px;
  margin-left:38px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.estado-verde{
  color:#238342;
  font-weight:bold;
}

.estado-rojo{
  color:#b52b2b;
  font-weight:bold;
}

.no-publicado{
  color:#888;
  font-size:13px;
}

.boton-mini{
  border:none;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold;
  cursor:pointer;
}

.boton-agotar{
  background:#fdeaea;
  color:#a42121;
}

.boton-reactivar{
  background:#e4f6e9;
  color:#176b32;
}

.boton-mini:disabled{
  opacity:.5;
}


/* PUBLICAR */

.boton-principal{
  width:100%;
  border:none;
  padding:18px;
  margin-top:20px;
  border-radius:14px;
  background:#9b3f2f;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.boton-principal:disabled{
  opacity:.5;
}


/* COMIDA */

.separador{
  border:none;
  border-top:1px solid #eee;
  margin:22px 0;
}

#controlComida{
  display:none;
}

.estado-comida{
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

.boton-comida-agotar{
  width:100%;
  border:2px solid #b52b2b;
  background:white;
  color:#b52b2b;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.boton-comida-reactivar{
  width:100%;
  border:2px solid #238342;
  background:white;
  color:#238342;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}


/* MENSAJES */

.mensaje{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.exito{
  display:block;
  background:#e6f7eb;
  color:#176b32;
}

.error{
  display:block;
  background:#fdeaea;
  color:#9c2222;
}

</style>
</head>


<body>

<div class="contenedor">


  <div class="encabezado">

    <h1>🍴 Cocina Sofía</h1>

    <div>
      Panel para publicar el menú
    </div>

  </div>


  <div
    class="fecha"
    id="fechaBonita">

    Cargando fecha...

  </div>



  <!-- ============================== -->
  <!-- DESAYUNOS -->
  <!-- ============================== -->

  <div class="tarjeta">

    <h2>
      🌅 Desayunos de hoy
    </h2>


    <div class="info">

      Marca los desayunos que ofrecerás hoy
      y escribe su precio.

      <br><br>

      Si un desayuno se termina,
      usa <strong>MARCAR AGOTADO</strong>.

      <br>

      Si simplemente no lo ofrecerás hoy,
      quita la palomita y vuelve a publicar.

    </div>


    <div id="listaDesayunos">

      Cargando...

    </div>

  </div>



  <!-- ============================== -->
  <!-- COMIDA -->
  <!-- ============================== -->

  <div class="tarjeta">

    <h2>
      🍲 Comida de hoy
    </h2>


    <div class="campo">

      <label>
        🥣 Sopa o crema
      </label>

      <select id="sopa"></select>

    </div>


    <div class="campo">

      <label>
        🍗 Guiso
      </label>

      <select id="guiso"></select>

    </div>


    <div class="campo">

      <label>
        🍚 Guarnición 1
      </label>

      <select id="guarnicion1"></select>

    </div>


    <div class="campo">

      <label>
        🍚 Guarnición 2
      </label>

      <select id="guarnicion2"></select>

    </div>


    <div class="campo">

      <label>
        🍮 Postre
      </label>

      <select id="postre"></select>

    </div>


    <div class="campo">

      <label>
        🥤 Agua
      </label>

      <select id="agua"></select>

    </div>


    <hr class="separador">


    <div class="campo">

      <label>
        💰 Precio del menú completo
      </label>

      <input
        id="precio"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="Ejemplo: 100">

    </div>


    <button
      class="boton-principal"
      id="publicar"
      onclick="publicarTodo()">

      PUBLICAR / ACTUALIZAR MENÚ DE HOY

    </button>



    <!-- ESTADO COMIDA -->

    <div id="controlComida">

      <hr class="separador">


      <div
        id="estadoComida"
        class="estado-comida">
      </div>


      <button
        id="botonEstadoComida"
        onclick="cambiarEstadoComida()">
      </button>

    </div>



    <div
      id="mensaje"
      class="mensaje">
    </div>

  </div>

</div>



<script>


// ========================================
// SUPABASE
// ========================================

const SUPABASE_URL =
"https://yawuozkdndxdreepqlaw.supabase.co";


const SUPABASE_KEY =
"sb_publishable_SNZVLb4pwoSdNO2iBKn2lA_qjegXePB";


const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



let productos = [];

let menuHoy = [];

let comidaDisponible = true;



// ========================================
// FECHA LOCAL
// ========================================

function fechaLocalISO(){

  const ahora =
    new Date();


  const year =
    ahora.getFullYear();


  const month =
    String(
      ahora.getMonth() + 1
    )
    .padStart(2,"0");


  const day =
    String(
      ahora.getDate()
    )
    .padStart(2,"0");


  return `${year}-${month}-${day}`;

}



function mostrarFecha(){

  let texto =
    new Date()
    .toLocaleDateString(
      "es-MX",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );


  texto =
    texto.charAt(0).toUpperCase()
    +
    texto.slice(1);


  document
    .getElementById(
      "fechaBonita"
    )
    .textContent =
      "📅 " + texto;

}



// ========================================
// CARGAR CATÁLOGO
// ========================================

async function cargarProductos(){

  const {
    data,
    error
  } =
    await db
      .from("cs_productos")
      .select(
        "id,categoria,nombre,precio,orden"
      )
      .eq(
        "activo",
        true
      )
      .order(
        "orden"
      );


  if(error){

    console.error(
      "Error productos:",
      error
    );


    mostrarMensaje(
      "No fue posible cargar los productos.",
      false
    );


    return;

  }


  productos =
    data || [];


  cargarSelect(
    "sopa",
    "SOPA_CREMA"
  );


  cargarSelect(
    "guiso",
    "GUISO"
  );


  cargarSelect(
    "guarnicion1",
    "GUARNICION"
  );


  cargarSelect(
    "guarnicion2",
    "GUARNICION"
  );


  cargarSelect(
    "postre",
    "POSTRE"
  );


  cargarSelect(
    "agua",
    "AGUA"
  );


  crearDesayunos();

}



// ========================================
// CREAR SELECT
// ========================================

function cargarSelect(
  id,
  categoria
){

  const select =
    document.getElementById(
      id
    );


  select.innerHTML =
    '<option value="">Seleccionar...</option>';


  productos
    .filter(
      p =>
        p.categoria ===
        categoria
    )
    .forEach(
      p => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          String(p.id);


        option.textContent =
          p.nombre;


        select.appendChild(
          option
        );

      }
    );

}



// ========================================
// CREAR DESAYUNOS
// ========================================

function crearDesayunos(){

  const contenedor =
    document.getElementById(
      "listaDesayunos"
    );


  contenedor.innerHTML =
    "";


  productos
    .filter(
      p =>
        p.categoria ===
        "DESAYUNO"
    )
    .forEach(
      p => {

        const fila =
          document.createElement(
            "div"
          );


        fila.className =
          "desayuno";


        fila.innerHTML = `

          <div class="desayuno-superior">

            <input
              type="checkbox"
              class="checkDesayuno"
              id="desayuno_${p.id}"
              value="${p.id}"
            >


            <label
              for="desayuno_${p.id}">

              ${p.nombre}

            </label>


            <div>

              <div class="etiqueta-precio">
                Precio
              </div>


              <input
                type="number"
                inputmode="decimal"
                min="0"
                placeholder="$"
                class="precio-desayuno"
                id="precio_${p.id}"
              >

            </div>

          </div>


          <div
            class="estado-desayuno"
            id="estado_${p.id}">

            <span class="no-publicado">
              No publicado hoy
            </span>

          </div>

        `;


        contenedor.appendChild(
          fila
        );

      }
    );

}



// ========================================
// CONSULTAR MENÚ REAL
// ========================================

async function cargarMenuHoy(){

  const {
    data,
    error
  } =
    await db.rpc(
      "cs_menu_completo_dia",
      {
        p_fecha:
          fechaLocalISO()
      }
    );


  if(error){

    console.error(
      "Error menu:",
      error
    );


    mostrarMensaje(
      "No fue posible recuperar el menú de hoy.",
      false
    );


    return false;

  }


  menuHoy =
    data || [];


  pintarDesayunos();

  pintarComida();


  return true;

}



// ========================================
// PINTAR DESAYUNOS
// ========================================

function pintarDesayunos(){

  const catalogoDesayunos =
    productos.filter(
      p =>
        p.categoria ===
        "DESAYUNO"
    );


  /*
    Primero ponemos TODO en estado
    "no publicado".
  */

  catalogoDesayunos.forEach(
    producto => {

      const check =
        document.getElementById(
          "desayuno_" +
          producto.id
        );


      const precio =
        document.getElementById(
          "precio_" +
          producto.id
        );


      const estado =
        document.getElementById(
          "estado_" +
          producto.id
        );


      if(check){
        check.checked = false;
      }


      if(precio){
        precio.value = "";
      }


      if(estado){

        estado.innerHTML = `

          <span class="no-publicado">
            No publicado hoy
          </span>

        `;

      }

    }
  );



  /*
    Ahora solamente marcamos los desayunos
    que REALMENTE existen en cs_menu_dia.
  */

  const desayunosPublicados =
    menuHoy.filter(
      item =>
        item.tipo ===
        "DESAYUNO"
    );


  desayunosPublicados.forEach(
    item => {

      const productoId =
        Number(
          item.producto_id
        );


      const check =
        document.getElementById(
          "desayuno_" +
          productoId
        );


      const precio =
        document.getElementById(
          "precio_" +
          productoId
        );


      if(check){

        check.checked =
          true;

      }


      if(precio){

        precio.value =
          Number(
            item.precio_menu
          );

      }


      pintarEstadoDesayuno(
        productoId,
        item.disponible === true
      );

    }
  );

}



// ========================================
// ESTADO DESAYUNO
// ========================================

function pintarEstadoDesayuno(
  productoId,
  disponible
){

  const contenedor =
    document.getElementById(
      "estado_" +
      productoId
    );


  if(!contenedor){
    return;
  }


  if(disponible){

    contenedor.innerHTML = `

      <span class="estado-verde">
        🟢 Disponible
      </span>


      <button
        type="button"
        class="
          boton-mini
          boton-agotar
        "
        onclick="
          cambiarEstadoDesayuno(
            ${productoId},
            false,
            this
          )
        ">

        MARCAR AGOTADO

      </button>

    `;

  }

  else{

    contenedor.innerHTML = `

      <span class="estado-rojo">
        🔴 Agotado por hoy
      </span>


      <button
        type="button"
        class="
          boton-mini
          boton-reactivar
        "
        onclick="
          cambiarEstadoDesayuno(
            ${productoId},
            true,
            this
          )
        ">

        VOLVER A ACTIVAR

      </button>

    `;

  }

}



// ========================================
// CAMBIAR ESTADO DESAYUNO
// ========================================

async function cambiarEstadoDesayuno(
  productoId,
  nuevoEstado,
  boton
){

  boton.disabled =
    true;


  boton.textContent =
    "GUARDANDO...";


  /*
    Esta es exactamente la función
    que ya comprobamos manualmente
    que funciona en Supabase.
  */

  const {
    data,
    error
  } =
    await db.rpc(
      "cs_cambiar_estado_desayuno",
      {

        p_fecha:
          fechaLocalISO(),

        p_producto_id:
          Number(productoId),

        p_disponible:
          nuevoEstado

      }
    );


  if(error){

    console.error(
      "RPC desayuno:",
      error
    );


    mostrarMensaje(
      "No se pudo cambiar el estado. Intenta nuevamente.",
      false
    );


    boton.disabled =
      false;


    return;

  }



  /*
    MUY IMPORTANTE:
    No asumimos que funcionó.
    Volvemos a leer Supabase.
  */

  const recargado =
    await cargarMenuHoy();


  if(!recargado){
    return;
  }



  const registro =
    menuHoy.find(
      item =>
        item.tipo ===
          "DESAYUNO"
        &&
        Number(
          item.producto_id
        ) ===
          Number(productoId)
    );


  if(!registro){

    mostrarMensaje(
      "El desayuno no aparece publicado en el menú de hoy.",
      false
    );

    return;

  }



  /*
    Comprobamos el estado REAL
    que regresó Supabase.
  */

  if(
    registro.disponible ===
    nuevoEstado
  ){

    mostrarMensaje(

      nuevoEstado

        ? "🟢 Desayuno disponible nuevamente."

        : "🔴 Desayuno marcado como agotado.",

      true

    );

  }

  else{

    mostrarMensaje(
      "Supabase no confirmó el cambio de estado.",
      false
    );

  }

}



// ========================================
// PINTAR COMIDA
// ========================================

function pintarComida(){

  const comida =
    menuHoy.filter(
      item =>
        item.tipo ===
        "COMIDA"
    );


  const control =
    document.getElementById(
      "controlComida"
    );


  if(
    comida.length === 0
  ){

    control.style.display =
      "none";

    return;

  }


  control.style.display =
    "block";



  // SOPA

  const sopa =
    comida.find(
      x =>
        x.categoria ===
        "SOPA_CREMA"
    );


  if(sopa){

    document
      .getElementById(
        "sopa"
      )
      .value =
        String(
          sopa.producto_id
        );

  }



  // GUISO

  const guiso =
    comida.find(
      x =>
        x.categoria ===
        "GUISO"
    );


  if(guiso){

    document
      .getElementById(
        "guiso"
      )
      .value =
        String(
          guiso.producto_id
        );

  }



  // GUARNICIONES

  const guarniciones =
    comida.filter(
      x =>
        x.categoria ===
        "GUARNICION"
    );


  if(guarniciones[0]){

    document
      .getElementById(
        "guarnicion1"
      )
      .value =
        String(
          guarniciones[0]
            .producto_id
        );

  }


  if(guarniciones[1]){

    document
      .getElementById(
        "guarnicion2"
      )
      .value =
        String(
          guarniciones[1]
            .producto_id
        );

  }



  // POSTRE

  const postre =
    comida.find(
      x =>
        x.categoria ===
        "POSTRE"
    );


  if(postre){

    document
      .getElementById(
        "postre"
      )
      .value =
        String(
          postre.producto_id
        );

  }



  // AGUA

  const agua =
    comida.find(
      x =>
        x.categoria ===
        "AGUA"
    );


  if(agua){

    document
      .getElementById(
        "agua"
      )
      .value =
        String(
          agua.producto_id
        );

  }



  // PRECIO

  document
    .getElementById(
      "precio"
    )
    .value =
      Number(
        comida[0]
          .precio_menu
      );



  /*
    La comida completa debe tener
    el mismo estado.
  */

  comidaDisponible =
    comida.some(
      x =>
        x.disponible === true
    );


  pintarEstadoComida();

}



// ========================================
// ESTADO COMIDA
// ========================================

function pintarEstadoComida(){

  const estado =
    document.getElementById(
      "estadoComida"
    );


  const boton =
    document.getElementById(
      "botonEstadoComida"
    );


  if(comidaDisponible){

    estado.innerHTML = `

      <span class="estado-verde">

        🟢 COMIDA DISPONIBLE

      </span>

    `;


    boton.className =
      "boton-comida-agotar";


    boton.textContent =
      "🔴 MARCAR COMIDA AGOTADA";

  }

  else{

    estado.innerHTML = `

      <span class="estado-rojo">

        🔴 COMIDA AGOTADA POR HOY

      </span>

    `;


    boton.className =
      "boton-comida-reactivar";


    boton.textContent =
      "🟢 VOLVER A ACTIVAR COMIDA";

  }

}



// ========================================
// CAMBIAR ESTADO COMIDA
// ========================================

async function cambiarEstadoComida(){

  const boton =
    document.getElementById(
      "botonEstadoComida"
    );


  const nuevoEstado =
    !comidaDisponible;


  boton.disabled =
    true;


  const textoAnterior =
    boton.textContent;


  boton.textContent =
    "GUARDANDO...";


  const {
    error
  } =
    await db.rpc(
      "cs_cambiar_estado_comida",
      {

        p_fecha:
          fechaLocalISO(),

        p_disponible:
          nuevoEstado

      }
    );


  if(error){

    console.error(
      "RPC comida:",
      error
    );


    mostrarMensaje(
      "No se pudo cambiar el estado de la comida.",
      false
    );


    boton.disabled =
      false;


    boton.textContent =
      textoAnterior;


    return;

  }


  await cargarMenuHoy();


  const comida =
    menuHoy.filter(
      x =>
        x.tipo ===
        "COMIDA"
    );


  const confirmado =
    comida.length > 0
    &&
    comida.every(
      x =>
        x.disponible ===
        nuevoEstado
    );


  if(confirmado){

    mostrarMensaje(

      nuevoEstado

        ? "🟢 La comida está disponible nuevamente."

        : "🔴 La comida fue marcada como agotada.",

      true

    );

  }

  else{

    mostrarMensaje(
      "Supabase no confirmó el cambio de la comida.",
      false
    );

  }

}



// ========================================
// PUBLICAR / ACTUALIZAR
// ========================================

async function publicarTodo(){

  const boton =
    document.getElementById(
      "publicar"
    );


  const sopa =
    document
      .getElementById(
        "sopa"
      )
      .value;


  const guiso =
    document
      .getElementById(
        "guiso"
      )
      .value;


  const g1 =
    document
      .getElementById(
        "guarnicion1"
      )
      .value;


  const g2 =
    document
      .getElementById(
        "guarnicion2"
      )
      .value;


  const postre =
    document
      .getElementById(
        "postre"
      )
      .value;


  const agua =
    document
      .getElementById(
        "agua"
      )
      .value;


  const precio =
    Number(
      document
        .getElementById(
          "precio"
        )
        .value
    );



  // VALIDAR COMIDA

  if(
    !sopa ||
    !guiso ||
    !g1 ||
    !g2 ||
    !postre ||
    !agua
  ){

    mostrarMensaje(
      "Selecciona todos los elementos de la comida.",
      false
    );

    return;

  }


  if(g1 === g2){

    mostrarMensaje(
      "Selecciona dos guarniciones diferentes.",
      false
    );

    return;

  }


  if(
    !precio ||
    precio <= 0
  ){

    mostrarMensaje(
      "Escribe el precio del menú.",
      false
    );

    return;

  }



  // DESAYUNOS SELECCIONADOS

  const checks =
    Array.from(
      document.querySelectorAll(
        ".checkDesayuno:checked"
      )
    );


  const desayunos =
    [];


  const preciosDesayuno =
    [];


  for(
    const check
    of checks
  ){

    const productoId =
      Number(
        check.value
      );


    const precioDesayuno =
      Number(
        document
          .getElementById(
            "precio_" +
            productoId
          )
          .value
      );


    if(
      !precioDesayuno ||
      precioDesayuno <= 0
    ){

      mostrarMensaje(
        "Escribe el precio de todos los desayunos seleccionados.",
        false
      );

      return;

    }


    desayunos.push(
      productoId
    );


    preciosDesayuno.push(
      precioDesayuno
    );

  }



  const productosComida = [

    Number(sopa),

    Number(guiso),

    Number(g1),

    Number(g2),

    Number(postre),

    Number(agua)

  ];



  boton.disabled =
    true;


  boton.textContent =
    "PUBLICANDO...";



  // ========================================
  // PUBLICAR COMIDA
  // ========================================

  const {
    error:errorComida
  } =
    await db.rpc(
      "cs_publicar_menu",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          productosComida,

        p_precio:
          precio

      }
    );


  if(errorComida){

    console.error(
      "Publicar comida:",
      errorComida
    );


    mostrarMensaje(
      "No se pudo publicar la comida.",
      false
    );


    restaurarBoton();

    return;

  }



  // ========================================
  // PUBLICAR DESAYUNOS
  // ========================================

  const {
    error:errorDesayuno
  } =
    await db.rpc(
      "cs_publicar_desayunos_con_precio",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          desayunos,

        p_precios:
          preciosDesayuno

      }
    );


  if(errorDesayuno){

    console.error(
      "Publicar desayunos:",
      errorDesayuno
    );


    mostrarMensaje(
      "La comida se publicó, pero hubo un problema con los desayunos.",
      false
    );


    restaurarBoton();

    return;

  }



  /*
    Leemos nuevamente la base.
  */

  await cargarMenuHoy();



  /*
    VERIFICACIÓN:
    comprobamos que TODOS los desayunos
    seleccionados existen realmente.
  */

  const desayunosGuardados =
    menuHoy.filter(
      x =>
        x.tipo ===
        "DESAYUNO"
    );


  const todosGuardados =
    desayunos.every(
      productoId =>

        desayunosGuardados.some(
          item =>
            Number(
              item.producto_id
            ) ===
            Number(
              productoId
            )
        )

    );


  if(!todosGuardados){

    mostrarMensaje(
      "El menú se guardó parcialmente. Revisa los desayunos.",
      false
    );


    restaurarBoton();

    return;

  }



  mostrarMensaje(
    "✅ Menú de hoy publicado correctamente.",
    true
  );


  restaurarBoton();

}



// ========================================
// MENSAJES
// ========================================

function mostrarMensaje(
  texto,
  correcto
){

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.textContent =
    texto;


  mensaje.className =
    correcto
      ? "mensaje exito"
      : "mensaje error";

}



function restaurarBoton(){

  const boton =
    document.getElementById(
      "publicar"
    );


  boton.disabled =
    false;


  boton.textContent =
    "PUBLICAR / ACTUALIZAR MENÚ DE HOY";

}



// ========================================
// INICIAR
// ========================================

async function iniciar(){

  mostrarFecha();

  await cargarProductos();

  await cargarMenuHoy();

}


iniciar();


</script>

</html>
