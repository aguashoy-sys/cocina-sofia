<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cocina Sofía | Administrar menú</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff8f1;
  color:#333;
}

.contenedor{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.encabezado{
  text-align:center;
  margin-bottom:20px;
}

.encabezado h1{
  margin:0 0 5px;
  color:#9b3f2f;
}

.encabezado div{
  color:#777;
}

.fecha{
  background:#9b3f2f;
  color:white;
  padding:14px;
  border-radius:14px;
  font-weight:bold;
  text-align:center;
  font-size:18px;
}

.tarjeta{
  background:white;
  margin-top:18px;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.tarjeta h2{
  margin-top:0;
  color:#9b3f2f;
}

.info{
  background:#fff8f1;
  padding:13px;
  border-radius:10px;
  font-size:14px;
  line-height:1.4;
  margin-bottom:15px;
}

.campo{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

select,
input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  background:white;
}


/* DESAYUNOS */

.desayuno{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.desayuno:last-child{
  border-bottom:none;
}

.desayuno-superior{
  display:grid;
  grid-template-columns:28px 1fr 95px;
  gap:10px;
  align-items:center;
}

.desayuno-superior input[type="checkbox"]{
  width:22px;
  height:22px;
}

.desayuno-superior label{
  margin:0;
  font-weight:normal;
  font-size:17px;
}

.precio-desayuno{
  padding:10px;
  text-align:center;
}

.etiqueta-precio{
  font-size:12px;
  color:#777;
  text-align:center;
  margin-bottom:3px;
}

.estado-desayuno{
  margin-top:10px;
  margin-left:38px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.estado-verde{
  color:#238342;
  font-weight:bold;
}

.estado-rojo{
  color:#b52b2b;
  font-weight:bold;
}

.boton-mini{
  border:none;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold;
  cursor:pointer;
}

.boton-marcar-agotado{
  background:#fdeaea;
  color:#a42121;
}

.boton-reactivar{
  background:#e4f6e9;
  color:#176b32;
}


/* BOTÓN PUBLICAR */

.boton{
  width:100%;
  border:none;
  padding:18px;
  margin-top:20px;
  border-radius:14px;
  background:#9b3f2f;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.boton:disabled{
  opacity:.5;
}


/* COMIDA */

.separador{
  border:none;
  border-top:1px solid #eee;
  margin:22px 0;
}

.control-comida{
  display:none;
}

.estado-comida{
  text-align:center;
  font-weight:bold;
  font-size:16px;
  margin-bottom:12px;
}

.boton-agotado-comida{
  width:100%;
  border:2px solid #b52b2b;
  background:white;
  color:#b52b2b;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.boton-reactivar-comida{
  width:100%;
  border:2px solid #238342;
  background:white;
  color:#238342;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}


/* MENSAJES */

.mensaje{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.exito{
  display:block;
  background:#e6f7eb;
  color:#176b32;
}

.error{
  display:block;
  background:#fdeaea;
  color:#9c2222;
}
</style>
</head>

<body>

<div class="contenedor">

  <div class="encabezado">
    <h1>🍴 Cocina Sofía</h1>
    <div>Panel para publicar el menú</div>
  </div>

  <div class="fecha" id="fechaBonita">
    Cargando fecha...
  </div>


  <!-- DESAYUNOS -->

  <div class="tarjeta">

    <h2>🌅 Desayunos de hoy</h2>

    <div class="info">
      Marca los desayunos que ofrecerás hoy y escribe su precio.
      Si alguno se termina, podrás marcarlo como
      <strong>agotado</strong>.
    </div>

    <div id="listaDesayunos">
      Cargando...
    </div>

  </div>


  <!-- COMIDA -->

  <div class="tarjeta">

    <h2>🍲 Comida de hoy</h2>


    <div class="campo">
      <label>🥣 Sopa o crema</label>
      <select id="sopa"></select>
    </div>


    <div class="campo">
      <label>🍗 Guiso</label>
      <select id="guiso"></select>
    </div>


    <div class="campo">
      <label>🍚 Guarnición 1</label>
      <select id="guarnicion1"></select>
    </div>


    <div class="campo">
      <label>🍚 Guarnición 2</label>
      <select id="guarnicion2"></select>
    </div>


    <div class="campo">
      <label>🍮 Postre</label>
      <select id="postre"></select>
    </div>


    <div class="campo">
      <label>🥤 Agua</label>
      <select id="agua"></select>
    </div>


    <hr class="separador">


    <div class="campo">

      <label>💰 Precio del menú completo</label>

      <input
        id="precio"
        type="number"
        inputmode="decimal"
        min="0"
        placeholder="Ejemplo: 100">

    </div>


    <button
      class="boton"
      id="publicar"
      onclick="publicarTodo()">

      PUBLICAR / ACTUALIZAR MENÚ DE HOY

    </button>


    <!-- CONTROL DE AGOTADO COMIDA -->

    <div
      id="controlComida"
      class="control-comida">

      <hr class="separador">

      <div
        id="estadoComida"
        class="estado-comida">
      </div>

      <button
        id="botonEstadoComida"
        onclick="cambiarEstadoComida()">
      </button>

    </div>


    <div
      id="mensaje"
      class="mensaje">
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://yawuozkdndxdreepqlaw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_SNZVLb4pwoSdNO2iBKn2lA_qjegXePB";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let productos = [];

let menuHoy = [];

let comidaDisponible = true;


// ========================================
// FECHA
// ========================================

function fechaLocalISO(){

  const ahora =
    new Date();

  const year =
    ahora.getFullYear();

  const month =
    String(
      ahora.getMonth() + 1
    ).padStart(2,"0");

  const day =
    String(
      ahora.getDate()
    ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function mostrarFecha(){

  const fecha =
    new Date();

  let texto =
    fecha.toLocaleDateString(
      "es-MX",
      {
        weekday:"long",
        day:"numeric",
        month:"long"
      }
    );

  texto =
    texto.charAt(0).toUpperCase()
    + texto.slice(1);

  document
    .getElementById(
      "fechaBonita"
    )
    .textContent =
      "📅 " + texto;

}



// ========================================
// PRODUCTOS
// ========================================

async function cargarProductos(){

  const {
    data,
    error
  } =
    await db
      .from("cs_productos")
      .select(
        "id,categoria,nombre,precio,orden"
      )
      .eq("activo",true)
      .order("orden");


  if(error){

    console.error(error);

    mostrarMensaje(
      "No fue posible cargar los productos.",
      false
    );

    return;
  }


  productos =
    data || [];


  cargarSelect(
    "sopa",
    "SOPA_CREMA"
  );

  cargarSelect(
    "guiso",
    "GUISO"
  );

  cargarSelect(
    "guarnicion1",
    "GUARNICION"
  );

  cargarSelect(
    "guarnicion2",
    "GUARNICION"
  );

  cargarSelect(
    "postre",
    "POSTRE"
  );

  cargarSelect(
    "agua",
    "AGUA"
  );


  crearListaDesayunos();

}



// ========================================
// SELECTS
// ========================================

function cargarSelect(
  id,
  categoria
){

  const select =
    document.getElementById(id);


  select.innerHTML =
    '<option value="">Seleccionar...</option>';


  productos
    .filter(
      p =>
        p.categoria === categoria
    )
    .forEach(p => {

      const opcion =
        document.createElement(
          "option"
        );

      opcion.value =
        p.id;

      opcion.textContent =
        p.nombre;

      select.appendChild(
        opcion
      );

    });

}



// ========================================
// LISTA DE DESAYUNOS
// ========================================

function crearListaDesayunos(){

  const contenedor =
    document.getElementById(
      "listaDesayunos"
    );


  contenedor.innerHTML =
    "";


  const desayunos =
    productos.filter(
      p =>
        p.categoria ===
        "DESAYUNO"
    );


  desayunos.forEach(p => {

    const fila =
      document.createElement(
        "div"
      );


    fila.className =
      "desayuno";


    fila.innerHTML = `

      <div class="desayuno-superior">

        <input
          type="checkbox"
          class="checkDesayuno"
          id="desayuno_${p.id}"
          value="${p.id}"
        >

        <label
          for="desayuno_${p.id}">
          ${p.nombre}
        </label>


        <div>

          <div class="etiqueta-precio">
            Precio
          </div>

          <input
            type="number"
            inputmode="decimal"
            min="0"
            placeholder="$"
            class="precio-desayuno"
            id="precio_${p.id}"
          >

        </div>

      </div>


      <div
        class="estado-desayuno"
        id="estado_${p.id}">
      </div>

    `;


    contenedor.appendChild(
      fila
    );

  });

}



// ========================================
// CARGAR MENÚ COMPLETO
// ========================================

async function cargarMenuHoy(){

  const {
    data,
    error
  } =
    await db.rpc(
      "cs_menu_completo_dia",
      {
        p_fecha:
          fechaLocalISO()
      }
    );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No fue posible recuperar el menú de hoy.",
      false
    );

    return;
  }


  menuHoy =
    data || [];


  recuperarDesayunos();

  recuperarComida();

}



// ========================================
// RECUPERAR DESAYUNOS
// ========================================

function recuperarDesayunos(){

  /*
    Primero limpiamos todos los estados.
    Así evitamos información vieja.
  */

  productos
    .filter(
      p =>
        p.categoria ===
        "DESAYUNO"
    )
    .forEach(p => {

      const check =
        document.getElementById(
          "desayuno_" + p.id
        );

      const precio =
        document.getElementById(
          "precio_" + p.id
        );

      const estado =
        document.getElementById(
          "estado_" + p.id
        );


      if(check){
        check.checked = false;
      }

      if(precio){
        precio.value = "";
      }

      if(estado){
        estado.innerHTML = "";
      }

    });


  const desayunos =
    menuHoy.filter(
      x =>
        x.tipo ===
        "DESAYUNO"
    );


  desayunos.forEach(
    item => {

      const productoId =
        Number(
          item.producto_id
        );


      const check =
        document.getElementById(
          "desayuno_" +
          productoId
        );


      const precio =
        document.getElementById(
          "precio_" +
          productoId
        );


      if(check){
        check.checked = true;
      }


      if(precio){

        precio.value =
          Number(
            item.precio_menu
          );

      }


      mostrarEstadoDesayuno(
        item
      );

    });

}



// ========================================
// MOSTRAR ESTADO DESAYUNO
// ========================================

function mostrarEstadoDesayuno(
  item
){

  const productoId =
    Number(
      item.producto_id
    );


  const contenedor =
    document.getElementById(
      "estado_" +
      productoId
    );


  if(!contenedor){
    return;
  }


  if(item.disponible){

    contenedor.innerHTML = `

      <span class="estado-verde">
        🟢 Disponible
      </span>

      <button
        class="
          boton-mini
          boton-marcar-agotado
        "
        onclick="
          cambiarEstadoDesayuno(
            ${productoId},
            false
          )
        ">

        MARCAR AGOTADO

      </button>

    `;

  }

  else{

    contenedor.innerHTML = `

      <span class="estado-rojo">
        🔴 Agotado por hoy
      </span>

      <button
        class="
          boton-mini
          boton-reactivar
        "
        onclick="
          cambiarEstadoDesayuno(
            ${productoId},
            true
          )
        ">

        VOLVER A ACTIVAR

      </button>

    `;

  }

}



// ========================================
// CAMBIAR ESTADO DESAYUNO
// ========================================

async function cambiarEstadoDesayuno(
  productoId,
  nuevoEstado
){

  const {
    error
  } =
    await db.rpc(
      "cs_cambiar_estado_desayuno",
      {

        p_fecha:
          fechaLocalISO(),

        p_producto_id:
          productoId,

        p_disponible:
          nuevoEstado

      }
    );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cambiar el estado del desayuno.",
      false
    );

    return;
  }


  mostrarMensaje(

    nuevoEstado

      ? "🟢 Desayuno disponible nuevamente."

      : "🔴 Desayuno marcado como agotado.",

    true

  );


  /*
    Volvemos a consultar Supabase.
    Así mostramos el estado REAL
    guardado en la base.
  */

  await cargarMenuHoy();

}



// ========================================
// RECUPERAR COMIDA
// ========================================

function recuperarComida(){

  const comida =
    menuHoy.filter(
      x =>
        x.tipo ===
        "COMIDA"
    );


  const control =
    document.getElementById(
      "controlComida"
    );


  if(
    comida.length === 0
  ){

    control.style.display =
      "none";

    return;
  }


  control.style.display =
    "block";


  // SOPA

  const sopa =
    comida.find(
      x =>
        x.categoria ===
        "SOPA_CREMA"
    );


  if(sopa){

    document
      .getElementById(
        "sopa"
      )
      .value =
        sopa.producto_id;

  }


  // GUISO

  const guiso =
    comida.find(
      x =>
        x.categoria ===
        "GUISO"
    );


  if(guiso){

    document
      .getElementById(
        "guiso"
      )
      .value =
        guiso.producto_id;

  }


  // GUARNICIONES

  const guarniciones =
    comida.filter(
      x =>
        x.categoria ===
        "GUARNICION"
    );


  if(guarniciones[0]){

    document
      .getElementById(
        "guarnicion1"
      )
      .value =
        guarniciones[0]
          .producto_id;

  }


  if(guarniciones[1]){

    document
      .getElementById(
        "guarnicion2"
      )
      .value =
        guarniciones[1]
          .producto_id;

  }


  // POSTRE

  const postre =
    comida.find(
      x =>
        x.categoria ===
        "POSTRE"
    );


  if(postre){

    document
      .getElementById(
        "postre"
      )
      .value =
        postre.producto_id;

  }


  // AGUA

  const agua =
    comida.find(
      x =>
        x.categoria ===
        "AGUA"
    );


  if(agua){

    document
      .getElementById(
        "agua"
      )
      .value =
        agua.producto_id;

  }


  // PRECIO

  document
    .getElementById(
      "precio"
    )
    .value =
      Number(
        comida[0]
          .precio_menu
      );


  /*
    Todos los componentes de la comida
    se cambian juntos.
  */

  comidaDisponible =
    comida.some(
      x =>
        x.disponible === true
    );


  mostrarEstadoComida();

}



// ========================================
// MOSTRAR ESTADO COMIDA
// ========================================

function mostrarEstadoComida(){

  const estado =
    document.getElementById(
      "estadoComida"
    );


  const boton =
    document.getElementById(
      "botonEstadoComida"
    );


  if(comidaDisponible){

    estado.innerHTML = `

      <span class="estado-verde">
        🟢 COMIDA DISPONIBLE
      </span>

    `;


    boton.className =
      "boton-agotado-comida";


    boton.textContent =
      "🔴 MARCAR COMIDA AGOTADA";

  }

  else{

    estado.innerHTML = `

      <span class="estado-rojo">
        🔴 COMIDA AGOTADA POR HOY
      </span>

    `;


    boton.className =
      "boton-reactivar-comida";


    boton.textContent =
      "🟢 VOLVER A ACTIVAR COMIDA";

  }

}



// ========================================
// CAMBIAR ESTADO COMIDA
// ========================================

async function cambiarEstadoComida(){

  const nuevoEstado =
    !comidaDisponible;


  const {
    error
  } =
    await db.rpc(
      "cs_cambiar_estado_comida",
      {

        p_fecha:
          fechaLocalISO(),

        p_disponible:
          nuevoEstado

      }
    );


  if(error){

    console.error(error);

    mostrarMensaje(
      "No se pudo cambiar el estado de la comida.",
      false
    );

    return;
  }


  mostrarMensaje(

    nuevoEstado

      ? "🟢 La comida está disponible nuevamente."

      : "🔴 La comida fue marcada como agotada.",

    true

  );


  await cargarMenuHoy();

}



// ========================================
// PUBLICAR TODO
// ========================================

async function publicarTodo(){

  const boton =
    document.getElementById(
      "publicar"
    );


  const sopa =
    document.getElementById(
      "sopa"
    ).value;


  const guiso =
    document.getElementById(
      "guiso"
    ).value;


  const g1 =
    document.getElementById(
      "guarnicion1"
    ).value;


  const g2 =
    document.getElementById(
      "guarnicion2"
    ).value;


  const postre =
    document.getElementById(
      "postre"
    ).value;


  const agua =
    document.getElementById(
      "agua"
    ).value;


  const precio =
    Number(
      document
        .getElementById(
          "precio"
        )
        .value
    );


  // VALIDAR COMIDA

  if(
    !sopa ||
    !guiso ||
    !g1 ||
    !g2 ||
    !postre ||
    !agua
  ){

    mostrarMensaje(
      "Selecciona todos los elementos de la comida.",
      false
    );

    return;
  }


  if(g1 === g2){

    mostrarMensaje(
      "Selecciona dos guarniciones diferentes.",
      false
    );

    return;
  }


  if(
    !precio ||
    precio <= 0
  ){

    mostrarMensaje(
      "Escribe el precio del menú.",
      false
    );

    return;
  }



  // DESAYUNOS

  const checks =
    Array.from(
      document.querySelectorAll(
        ".checkDesayuno:checked"
      )
    );


  const desayunos =
    [];

  const preciosDesayuno =
    [];


  for(
    const check
    of checks
  ){

    const id =
      Number(
        check.value
      );


    const precioDesayuno =
      Number(
        document
          .getElementById(
            "precio_" + id
          )
          .value
      );


    if(
      !precioDesayuno ||
      precioDesayuno <= 0
    ){

      mostrarMensaje(
        "Escribe el precio de todos los desayunos seleccionados.",
        false
      );

      return;
    }


    desayunos.push(
      id
    );


    preciosDesayuno.push(
      precioDesayuno
    );

  }



  const productosComida = [

    Number(sopa),

    Number(guiso),

    Number(g1),

    Number(g2),

    Number(postre),

    Number(agua)

  ];



  boton.disabled =
    true;


  boton.textContent =
    "PUBLICANDO...";



  // ========================================
  // PUBLICAR COMIDA
  // ========================================

  const {
    error:errorComida
  } =
    await db.rpc(
      "cs_publicar_menu",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          productosComida,

        p_precio:
          precio

      }
    );


  if(errorComida){

    console.error(
      errorComida
    );


    mostrarMensaje(
      "No se pudo publicar la comida.",
      false
    );


    restaurarBoton();

    return;
  }



  // ========================================
  // PUBLICAR DESAYUNOS
  // ========================================

  const {
    error:errorDesayuno
  } =
    await db.rpc(
      "cs_publicar_desayunos_con_precio",
      {

        p_fecha:
          fechaLocalISO(),

        p_productos:
          desayunos,

        p_precios:
          preciosDesayuno

      }
    );


  if(errorDesayuno){

    console.error(
      errorDesayuno
    );


    mostrarMensaje(
      "La comida se publicó, pero hubo un problema con los desayunos.",
      false
    );


    restaurarBoton();

    return;
  }



  mostrarMensaje(
    "✅ Menú de hoy publicado correctamente.",
    true
  );


  restaurarBoton();


  /*
    Recuperamos de nuevo lo que realmente
    quedó guardado en Supabase.
  */

  await cargarMenuHoy();

}



// ========================================
// MENSAJES
// ========================================

function mostrarMensaje(
  texto,
  correcto
){

  const mensaje =
    document.getElementById(
      "mensaje"
    );


  mensaje.textContent =
    texto;


  mensaje.className =
    correcto
      ? "mensaje exito"
      : "mensaje error";

}


function restaurarBoton(){

  const boton =
    document.getElementById(
      "publicar"
    );


  boton.disabled =
    false;


  boton.textContent =
    "PUBLICAR / ACTUALIZAR MENÚ DE HOY";

}



// ========================================
// INICIAR
// ========================================

async function iniciar(){

  mostrarFecha();

  await cargarProductos();

  await cargarMenuHoy();

}


iniciar();

</script>

</html>
